name: fictional_drug_and_disease_ref
description: "架空医薬品・疾患データを扱う医療リファレンスアプリの参考実装。"
repository: https://github.com/Corvus400/fictional-drug-and-disease-ref-flutter
issue_tracker: https://github.com/Corvus400/fictional-drug-and-disease-ref-flutter/issues
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.11.3

dependencies:
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  drift: ^2.32.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.1
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.7
  flutter_riverpod: ^3.3.1
  freezed_annotation: ^3.1.0
  go_router: ^17.2.3
  intl: ^0.20.2
  json_annotation: ^4.11.0
  logger: ^2.7.0
  material_symbols_icons: ^4.2928.1
  package_info_plus: ^10.1.0
  path: ^1.9.1
  path_provider: ^2.1.5
  retrofit: ^4.9.2
  shared_preferences: ^2.5.5
  skeletonizer: ^2.1.3
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  alchemist: ^0.14.0
  analyzer: ^10.0.1
  build_runner: ^2.15.0
  drift_dev: ^2.32.1
  file: ^7.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  image: ^4.3.0
  json_serializable: ^6.13.2
  meta: ^1.17.0
  mocktail: ^1.0.4
  patrol: 4.5.0
  retrofit_generator: ^10.2.5
  very_good_analysis: ^10.2.0

patrol:
  app_name: FDDR
  android:
    package_name: com.corvus400.fictional_drug_and_disease_ref.dev
  ios:
    bundle_id: com.corvus400.fictionalDrugAndDiseaseRef

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  min_sdk_android: 26
  adaptive_icon_background: "#008CF4"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
  remove_alpha_ios: true
  image_path_ios_dark_transparent: assets/icon/icon_ios_dark.png
  image_path_ios_tinted_grayscale: assets/icon/icon_ios_tinted.png
  desaturate_tinted_to_grayscale_ios: true

flutter:
  generate: true

  uses-material-design: true

  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf

  assets:
    - assets/fonts/
