name: Release Android

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create when running manually"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || inputs.tag || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup-flutter

      - name: Resolve release version
        id: release-version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          app_version="$(python3 - <<'PY'
          from pathlib import Path
          import re

          match = re.search(r"^version:\s*(\S+)\s*$", Path("pubspec.yaml").read_text(), re.MULTILINE)
          if match is None:
              raise SystemExit("pubspec.yaml version not found")
          print(match.group(1))
          PY
          )"
          build_name="${app_version%%+*}"
          build_number="${app_version#*+}"
          if [ "$build_name" = "$app_version" ] || [ -z "$build_name" ] || [ -z "$build_number" ]; then
            echo "pubspec.yaml version must be formatted as <build-name>+<build-number>." >&2
            exit 1
          fi

          expected_tag="v$build_name"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG:-$expected_tag}"
          else
            tag="$REF_NAME"
          fi

          if [ "$tag" != "$expected_tag" ]; then
            echo "Release tag must match pubspec build name: expected $expected_tag, got $tag." >&2
            exit 1
          fi

          echo "build_name=$build_name" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=()
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required Android signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            printf 'storeFile=upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build prod APK
        run: >
          flutter build apk
          --flavor prod
          -t lib/main_prod.dart
          --dart-define-from-file=dart_defines/prod.json
          --release
          --build-name=${{ steps.release-version.outputs.build_name }}
          --build-number=${{ steps.release-version.outputs.build_number }}

      - name: Verify prod APK network permission
        shell: bash
        run: |
          set -euo pipefail

          aapt_bin="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -n 1)"
          if [ -z "$aapt_bin" ]; then
            echo "aapt not found under ANDROID_HOME/build-tools" >&2
            exit 1
          fi

          "$aapt_bin" dump permissions build/app/outputs/flutter-apk/app-prod-release.apk |
            grep -F "uses-permission: name='android.permission.INTERNET'"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-version.outputs.tag }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            build/app/outputs/flutter-apk/app-prod-release.apk \
            --title "App distribution $TAG" \
            --notes "Prod Android APK connected to https://fictional-drugref.win."
